[package]
name = "pesti-gguf"
version = "0.2.2"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Memory-safe, minimal-dependency GGUF parser for Rust native LLM development"
repository = "https://github.com/crombojambo/pesti-gguf"
readme = "README.md"
keywords = ["gguf", "llama", "llm", "parser", "quantization"]
categories = ["parsing", "data-structures", "encoding"]
authors = ["CromboJambo <dustinjgrover@gmail.com>"]

[dependencies]
# Serialization (downstream only)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.24.0"
criterion = "0.5"

[[bench]]
name = "pesti_gguf_benchmarks"
harness = false

[[bench]]
name = "comprehensive_bench"
harness = false

[[bench]]
name = "detailed_bench"
harness = false
