[package]
name = "pesti-gguf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Memory-safe, zero-dependency GGUF parser for Rust"
repository = "https://github.com/crombojambo/pesti-gguf"
readme = "README.md"
keywords = ["gguf", "llama", "llm", "parser", "quantization"]
categories = ["parsing", "data-structures", "encoding"]
authors = ["crombo <your-email@example.com>"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Binary I/O
byteorder = { version = "1.4.3", default-features = false, features = ["std"] }
half = { version = "2.7.1", features = ["serde"] }

[dev-dependencies]
tempfile = "3.24.0"
criterion = "0.5"

[[bench]]
name = "pesti_gguf_benchmarks"
harness = false
